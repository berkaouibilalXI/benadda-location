# Build the site and upload it by FTPS (explicit TLS, port 21) to benadda-dreamcar.com
# Runs on every push to `main`, or manually from the Actions tab ("Run workflow").
#
# GitHub: Settings > Secrets and variables > Actions
#   Variables (tab "Variables"):
#     FTP_SERVER          ftp.benadda-dreamcar.com
#     FTP_USERNAME        deploytoroot@benadda-dreamcar.com
#     FTP_SERVER_DIR      public_html/        (optional, this is the default; must end with /)
#     VITE_CARS_PROVIDER  json
#     VITE_SUPABASE_URL   https://YOUR-PROJECT.supabase.co
#     VITE_SUPABASE_BUCKET  Location
#   Secrets (tab "Secrets"):
#     FTP_PASSWORD
#     VITE_SUPABASE_ANON_KEY

name: Deploy to benadda-dreamcar.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once (they would upload over each other).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check deploy settings
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v (see the comment at the top of deploy.yml)"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Use the major shown by `pnpm -v` on your machine.
          # Delete this line if package.json has a "packageManager" field.
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vite bakes VITE_* values into the JS at build time, so they must exist HERE.
      # They end up public in the browser: use the anon/publishable key, never service_role.
      - name: Build
        run: pnpm build
        env:
          VITE_CARS_PROVIDER: ${{ vars.VITE_CARS_PROVIDER }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_BUCKET: ${{ vars.VITE_SUPABASE_BUCKET }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Check the FTP server is reachable from GitHub
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
        run: |
          if timeout 15 bash -c 'exec 3<>/dev/tcp/$FTP_SERVER/21'; then
            echo "FTP port 21 is reachable."
          else
            echo "::error::Cannot reach $FTP_SERVER on port 21 from GitHub. Check FTP_SERVER (if you use Cloudflare, the ftp record must be DNS-only, or use the server IP) and that your host does not block GitHub IPs."
            exit 1
          fi

      - name: Upload dist/ by FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ vars.FTP_SERVER }}
          port: 21
          protocol: ftps # explicit FTPS (FTP + TLS), what cPanel offers on port 21
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Web root of the account. The FTP account's folder is /home/gmzrkfea, so the site lives in public_html/.
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # "loose" accepts the host's certificate even if it is issued for the server name instead of
          # ftp.benadda-dreamcar.com (common on shared hosting). Try "strict" if your host's certificate covers it.
          security: strict
          # DANGER: never enable `dangerous-clean-slate`. It deletes EVERYTHING in server-dir.